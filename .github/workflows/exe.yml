name: build-exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip numpy zarr numcodecs tifffile matplotlib scipy pyinstaller
      - name: PyInstaller
        run: >
          pyinstaller --onefile --console --noconfirm --name MCSerDeLuz-buscar-tinta-papiro
          --collect-all numcodecs --collect-all zarr --collect-all tifffile
          --collect-submodules scipy.ndimage --hidden-import scipy._lib.messagestream
          --hidden-import matplotlib.backends.backend_tkagg --hidden-import matplotlib.backends.backend_agg
          buscar_tinta_papiro.py
      - name: Prueba (--help y segmento sintético)
        shell: pwsh
        run: |
          .\dist\MCSerDeLuz-buscar-tinta-papiro.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python crear_prueba.py
          .\dist\MCSerDeLuz-buscar-tinta-papiro.exe MCSerDeLuz-prueba-20990101000000.zip --sin-ventana --exportar-recortes --comprobar-solapes --salida prueba-out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem prueba-out
          if (-not (Test-Path prueba-out\MCSerDeLuz-informe-tinta-20990101000000.txt)) { exit 1 }
          python crear_prueba.py --muchos
          .\dist\MCSerDeLuz-buscar-tinta-papiro.exe MCSerDeLuz-prueba-20990101000001.zip --sin-ventana --exportar-recortes --comprobar-solapes --salida prueba64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $n = (Get-ChildItem prueba64\MCSerDeLuz-recortes-20990101000001\*.png).Count
          $f = (Get-Content prueba64\MCSerDeLuz-candidatos-tinta-20990101000001.csv).Count - 1
          Write-Host "sin tope: $n recortes, $f filas en el CSV"
          if ($n -lt 50 -or $f -ne $n) { exit 1 }
      - name: Prueba de ajustes (se guardan al cerrar con la X y vuelven al abrir)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata-prueba"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          python prueba_ajustes.py .\dist\MCSerDeLuz-buscar-tinta-papiro.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $j = Join-Path $env:APPDATA "MCSerDeLuz\buscar-tinta-ajustes.json"
          if (-not (Test-Path $j)) { Write-Host "no está $j"; exit 1 }
          Get-Content $j
          Get-FileHash dist\MCSerDeLuz-buscar-tinta-papiro.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: MCSerDeLuz-buscar-tinta-papiro
          path: dist/MCSerDeLuz-buscar-tinta-papiro.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb openbox wmctrl xdotool
          python -m pip install --upgrade pip numpy zarr numcodecs tifffile matplotlib scipy pyinstaller
      - name: PyInstaller (Linux)
        run: >
          pyinstaller --onefile --console --noconfirm --name MCSerDeLuz-buscar-tinta-papiro-linux
          --collect-all numcodecs --collect-all zarr --collect-all tifffile
          --collect-submodules scipy.ndimage --hidden-import scipy._lib.messagestream
          --hidden-import matplotlib.backends.backend_tkagg --hidden-import matplotlib.backends.backend_agg
          buscar_tinta_papiro.py
      - name: Prueba (--help y segmento sintético)
        run: |
          ./dist/MCSerDeLuz-buscar-tinta-papiro-linux --help
          python crear_prueba.py
          ./dist/MCSerDeLuz-buscar-tinta-papiro-linux MCSerDeLuz-prueba-20990101000000.zip --sin-ventana --exportar-recortes --comprobar-solapes --salida prueba-out
          ls -R prueba-out
          test -f prueba-out/MCSerDeLuz-informe-tinta-20990101000000.txt
          python crear_prueba.py --muchos
          ./dist/MCSerDeLuz-buscar-tinta-papiro-linux MCSerDeLuz-prueba-20990101000001.zip --sin-ventana --exportar-recortes --comprobar-solapes --salida prueba64
          n=$(ls prueba64/MCSerDeLuz-recortes-20990101000001/*.png | wc -l); f=$(( $(wc -l < prueba64/MCSerDeLuz-candidatos-tinta-20990101000001.csv) - 1 ))
          echo "sin tope: $n recortes, $f filas en el CSV"; test $n -ge 50 && test $f -eq $n
          sha256sum dist/MCSerDeLuz-buscar-tinta-papiro-linux
      - name: Prueba de ajustes (Xvfb, escribiendo de verdad y cerrando con la X)
        timeout-minutes: 10
        run: |
          export HOME=$RUNNER_TEMP/home-prueba; unset XDG_CONFIG_HOME; mkdir -p $HOME/Desktop
          xvfb-run -a -s "-screen 0 1366x768x24" bash -c 'openbox & sleep 2; python prueba_ajustes.py ./dist/MCSerDeLuz-buscar-tinta-papiro-linux'
          cat $HOME/.config/MCSerDeLuz/buscar-tinta-ajustes.json
      - uses: actions/upload-artifact@v4
        with:
          name: MCSerDeLuz-buscar-tinta-papiro-linux
          path: dist/MCSerDeLuz-buscar-tinta-papiro-linux
